apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutricheck-backend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nutricheck-backend
  template:
    metadata:
      labels:
        app: nutricheck-backend
    spec:
      containers:
        - name: backend
          image: myregistry.azurecr.io/nutricheck-backend:latest
          ports:
            - containerPort: 5001
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: nutricheck-config
                  key: NODE_ENV
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: nutricheck-config
                  key: PORT
            - name: MONGODB_URI
              valueFrom:
                configMapKeyRef:
                  name: nutricheck-config
                  key: MONGODB_URI
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: nutricheck-config
                  key: FRONTEND_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nutricheck-secret
                  key: JWT_SECRET
            - name: JWT_EXPIRE
              valueFrom:
                configMapKeyRef:
                  name: nutricheck-config
                  key: JWT_EXPIRE
            - name: EMAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: nutricheck-secret
                  key: EMAIL_HOST
            - name: EMAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: nutricheck-secret
                  key: EMAIL_PORT
            - name: EMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: nutricheck-secret
                  key: EMAIL_USER
            - name: EMAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: nutricheck-secret
                  key: EMAIL_PASS
            - name: EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: nutricheck-secret
                  key: EMAIL_FROM
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutricheck-frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nutricheck-frontend
  template:
    metadata:
      labels:
        app: nutricheck-frontend
    spec:
      containers:
        - name: frontend
          image: myregistry.azurecr.io/nutricheck-frontend:latest
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 15
