apiVersion: v1
kind: Service
metadata:
  name: nutricheck-backend
  namespace: default
spec:
  selector:
    app: nutricheck-backend
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: nutricheck-frontend
  namespace: default
spec:
  selector:
    app: nutricheck-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: LoadBalancer
